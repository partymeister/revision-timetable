name: build-k8s-timetable
# Keyless CI: no stored token, no SSH write-back key. The image goes to ghcr.io/partymeister with GITHUB_TOKEN
# (nothing is pushed to Docker Hub any more, dfox288/tum-cluster_k8s#78). The deploy job fetches the
# revision-k8s-deploy GitHub App key (owned by dfox288, installed on the manifests repo) from tum Infisical
# (project revision-websites-ci) via GitHub OIDC. This repo lives in the partymeister
# org, so the App token explicitly targets owner=dfox288.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC -> Infisical (DH push creds + GitHub App key)
  packages: write   # GITHUB_TOKEN pushes to ghcr.io (dfox288/tum-cluster_k8s#78)

jobs:
  build-app:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: GIT_COMMIT=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/partymeister/revision-timetable:latest
            ghcr.io/partymeister/revision-timetable:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-k8s:
    needs: build-app
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Fetch GitHub App key from Infisical (OIDC)
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          domain: https://secrets.tastatur-und-maus.net
          identity-id: ${{ secrets.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /

      - name: Mint short-lived GitHub App token for the manifests repo
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}
          owner: dfox288
          repositories: tum-cluster-revision-websites_k8s

      - name: Bump image SHA in the manifests repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DOCKER_REPO: revision-timetable   # matched after the registry/owner prefix, which the manifest line keeps
          MANIFESTS_REPO: dfox288/tum-cluster-revision-websites_k8s
          MANIFEST_FILES: timetable.revision-party.net/revision-timetable-deployment.yaml
        run: |
          set -euo pipefail
          # A freshly minted, repo-scoped App token sometimes answers "Repository not found" for a few
          # seconds (dfox288/tum-cluster_k8s#103): retry the clone and the push.
          for attempt in 1 2 3 4 5; do
            if git clone --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/${MANIFESTS_REPO}.git" manifests; then
              break
            fi
            if [ "$attempt" = 5 ]; then echo "[deploy] clone failed after 5 attempts"; exit 1; fi
            echo "[deploy] clone attempt ${attempt} failed (token scope lag?), retrying in 10s"
            rm -rf manifests
            sleep 10
          done
          cd manifests
          for file in $MANIFEST_FILES; do
            sed -i "s|/${DOCKER_REPO}:.*|/${DOCKER_REPO}:${GITHUB_SHA}|g" "$file"
          done
          git config user.email "info@tastatur-und-maus.net"
          git config user.name  "revision-deploy-bot"
          git add --all
          if git diff --cached --quiet; then
            echo "[deploy] manifest already at ${GITHUB_SHA} — nothing to push"
            exit 0
          fi
          git commit -m "deploy ${DOCKER_REPO}:${GITHUB_SHA}"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then break; fi
            if [ "$attempt" = 5 ]; then echo "[deploy] push failed after 5 attempts"; exit 1; fi
            echo "[deploy] push attempt ${attempt} failed (token scope lag?), retrying in 10s"
            sleep 10
          done
